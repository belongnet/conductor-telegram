name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 22 is what the Mac gateway deploys on; 24 is what publish.yml builds.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docs-version:
    name: Landing page states the released version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      # The landing page states the version in the hero badge and in the sample
      # terminal transcript. Both drifted seven minor releases behind VERSION
      # before anyone noticed, so a release that forgets them fails here instead.
      # Matched exactly, not by scanning for any vN.N.N: the page also quotes a
      # Node version, which is not this package's version and must not gate it.
      - name: Both versions the landing page claims match VERSION
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          missing=""
          grep -qF "<span class=\"hero-badge\">v$version / MIT" docs/index.html || missing="hero badge"
          grep -qF "<span class=\"a\">conductor-telegram</span> v$version" docs/index.html || missing="$missing sample terminal"
          if [ -n "$missing" ]; then
            echo "docs/index.html does not state v$version in: $missing" >&2
            grep -nE 'hero-badge|conductor-telegram</span> v' docs/index.html >&2
            exit 1
          fi

  deploy-script:
    name: Gateway scripts on macOS (bash 3.2 + BSD userland)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      # macOS ships bash 3.2, where `set -u` rejects "${arr[@]}" on an empty
      # array. The gateway updater and deploy run on this shell, so guard the
      # syntax and the no-Doppler argument path here rather than discovering
      # it mid-deploy.
      - name: Syntax-check under bash 3.2
        run: |
          /bin/bash -n scripts/deploy-mac-gateway.sh
          /bin/bash -n scripts/gateway-update.sh
      # The updater's behavioral suite exercises BSD ps/find/touch/tail and
      # real /bin/bash 3.2 semantics (process-group kill, wait) that the
      # ubuntu matrix cannot — a linux-green/mac-red regression would
      # otherwise land as a production deploy-failure loop.
      - run: npm ci
      - name: Updater behavioral suite on macOS
        run: node --import tsx --test tests/gateway-update-script.test.ts tests/gateway-updater.test.ts
      - name: Service install arguments expand with and without Doppler
        run: |
          /bin/bash -euo pipefail -c '
            SERVICE_INSTALL_ARGS=()
            show() { echo "argc=$#"; }
            show ${SERVICE_INSTALL_ARGS[@]+"${SERVICE_INSTALL_ARGS[@]}"}
            SERVICE_INSTALL_ARGS=(--doppler-project p --doppler-config c)
            show ${SERVICE_INSTALL_ARGS[@]+"${SERVICE_INSTALL_ARGS[@]}"}
          '
