name: Deploy Mac gateway

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: mac-gateway
  cancel-in-progress: true

jobs:
  deploy:
    name: Redeploy launchd gateway
    runs-on: [self-hosted, macOS, conductor-telegram-gateway]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Build, install, and restart gateway
        run: scripts/deploy-mac-gateway.sh
